<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ CHALLENGE CONTROL GIGA EDITION ⚠️</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #252538;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 450px;
            border: 2px solid #313244;
        }
        h1 {
            color: #ff0055;
            margin-top: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .chrono {
            font-size: 18px;
            color: #a6e3a1;
            margin: 15px 0;
            font-weight: bold;
        }
        .box-defi {
            background-color: #313244;
            color: #f9e2af;
            padding: 20px;
            border-radius: 10px;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            border-left: 5px solid #ff0055;
        }
        .boutons {
            display: none;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-reussi { background-color: #a6e3a1; color: #11111b; }
        .btn-echoue { background-color: #f38ba8; color: #11111b; }
        .score-board {
            font-size: 14px;
            color: #89b4fa;
            border-top: 1px solid #313244;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚠️ CHALLENGE CONTROL ⚠️</h1>
    <div class="chrono" id="chrono">Initialisation...</div>
    <div class="box-defi" id="box-defi">Préparation de la giga liste...</div>
    
    <div class="boutons" id="zone-boutons">
        <button class="btn-reussi" onclick="defiReussi()">✅ Réussi (+10 pts)</button>
        <button class="btn-echoue" onclick="defiEchoue()">❌ Échoué</button>
    </div>
    
    <div class="score-board" id="score-board">
        Score : 0 pts | Défis terminés : 0
    </div>
</div>

<script>
    let score = 0;
    let defisRealises = 0;
    const maxDefisParSession = 10;
    let tempsRestant = 5;
    let listeDefis = [];
    let horloge;

    function generer2000Defis() {
        const actions = [
            "ne dis plus le mot 'OUI' ni 'NON'", "parle uniquement en chuchotant", 
            "place le mot 'Banane' de façon naturelle", "parle avec un accent super bizarre",
            "interdiction absolue de sauter dans ton jeu", "fais un bruit de klaxon", 
            "répète la fin de toutes tes phrases", "parle comme un robot",
            "ferme un œil", "garde tes mains au-dessus de la tête",
            "chante au lieu de parler", "ajoute 'wesh' ou 'du coup' partout",
            "fais semblant d'être hyper fatigué", "n'utilise pas ta touche préférée",
            "parle uniquement en faisant des rimes", "cite un streamer connu"
        ];
        
        const contraintes = [
            "pendant les 2 prochaines minutes !", "pendant les 60 prochaines secondes.",
            "chaque fois que tu touches ton clavier !", "à chaque fois que tu gagnes un point.",
            "pendant tout le prochain round !", "jusqu'à la fin du chrono.",
            "dès que tu ouvres une nouvelle page !", "à la prochaine phrase que tu dis."
        ];

        const bonus = ["", " (Et fais-le sérieusement !)", " (Double score si réussi !)", " (C'est un giga défi !)"];
        
        let ensembleDefis = new Set();
        while(ensembleDefis.size < 2500) {
            let act = actions[Math.floor(Math.random() * actions.length)];
            let con = contraintes[Math.floor(Math.random() * contraintes.length)];
            let bon = bonus[Math.floor(Math.random() * bonus.length)];
            ensembleDefis.add(`👉 ${act} ${con}${bon}`);
        }
        return Array.from(ensembleDefis);
    }

    function actualiserChrono() {
        if (tempsRestant > 0) {
            document.getElementById("chrono").innerText = `Prochain défi dans : ${tempsRestant}s`;
            document.getElementById("chrono").style.color = "#cdd6f4";
            tempsRestant--;
            horloge = setTimeout(actualiserChrono, 1000);
        } else {
            declencherDefi();
        }
    }

    function declencherDefi() {
        document.getElementById("chrono").innerText = "⚠️ NOUVEAU DÉFI ! ⚠️";
        document.getElementById("chrono").style.color = "#ff0055";
        
        let defiChoisi = listeDefis[Math.floor(Math.random() * listeDefis.length)];
        document.getElementById("box-defi").innerText = defiChoisi;
        
        document.getElementById("zone-boutons").style.display = "flex";
    }

    function defiReussi() {
        score += 10;
        defisRealises++;
        verifierContinuer();
    }

    function defiEchoue() {
        defisRealises++;
        verifierContinuer();
    }

    function verifierContinuer() {
        document.getElementById("score-board").innerText = `Score : ${score} pts | Défis terminés : ${defisRealises}`;
        document.getElementById("zone-boutons").style.display = "none";
        
        if (defisRealises % maxDefisParSession === 0) {
            let reponse = confirm(`Tu as fait ${defisRealises} défis ! Veux-tu d'autres défis ?`);
            if (!reponse) {
                document.getElementById("box-defi").innerText = "Session terminée ! Quel giga score !";
                document.getElementById("chrono").innerText = "STOP";
                return;
            }
        }
        
        document.getElementById("box-defi").innerText = "Bien joué ! En attente du prochain...";
        tempsRestant = 5;
        actualiserChrono();
    }

    window.onload = function() {
        listeDefis = generer2000Defis();
        document.getElementById("box-defi").innerText = "Prêt !";
        tempsRestant = 5;
        actualiserChrono();
    };
</script>

</body>
</html>
